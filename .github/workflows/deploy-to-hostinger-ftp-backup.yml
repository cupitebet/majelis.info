name: Deploy Child Theme to Hostinger (FTP Backup)

# Deploy ONLY meup-child theme + custom files
# WordPress core & plugins are NOT deployed

on:
  push:
    branches:
      - beta
    paths:
      - 'wp-content/themes/meup-child/**'
      - 'majelis-*.css'
      - 'majelis-*.php'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    name: Deploy Child Theme via FTP
    # To enable FTP backup deploys, set ENABLE_BETA_DEPLOY=true AND ENABLE_BETA_DEPLOY_FTP_BACKUP=true.
    if: ${{ github.ref == 'refs/heads/beta' && secrets.ENABLE_BETA_DEPLOY == 'true' && secrets.ENABLE_BETA_DEPLOY_FTP_BACKUP == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Child Theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_BETA }}
          username: ${{ secrets.FTP_USERNAME_BETA }}
          password: ${{ secrets.FTP_PASSWORD_BETA }}
          server-dir: /home/u362428227/domains/majelis.info/public_html/beta/
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.gitignore
            **/.vscode/**
            **/wp-config.php
            **/*.md
            **/commit-wordpress.sh
            **/flutter-quick-setup.sh
            **/flutter-app-structure/**
            **/_deprecated/**
            **/scripts/**
            **/wp-admin.zip
            **/.htaccess.bk
            **/wp-config-SAMPLE.txt
