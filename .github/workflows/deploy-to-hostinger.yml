name: Deploy Child Theme to Hostinger

# Deploy ONLY meup-child theme + custom files
# WordPress core & plugins are NOT deployed
# Using FTPS (FTP over SSL/TLS) for encrypted connection

on:
  push:
    branches:
      - main
      - claude/main-with-ftps-01PkgG5fih5VoijEJJtXyKNa
    paths:
      - 'wp-content/themes/meup-child/**'
      - 'majelis-*.css'
      - 'majelis-*.php'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    name: Deploy Child Theme via FTPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Child Theme via FTPS (Encrypted)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.majelis.info
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /home/u362428227/domains/majelis.info/public_html/
          protocol: ftps
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.gitignore
            **/.vscode/**
            **/wp-config.php
            **/*.md
            **/commit-wordpress.sh
            **/flutter-quick-setup.sh
            **/flutter-app-structure/**
            **/_deprecated/**
            **/scripts/**
            **/wp-admin.zip
            **/.htaccess.bk
            **/wp-config-SAMPLE.txt
