name: Deploy Child Theme to Hostinger

# Deploy ONLY meup-child theme + custom files
# WordPress core & plugins are NOT deployed

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/meup-child/**'
      - 'majelis-*.css'
      - 'majelis-*.php'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    name: Deploy Child Theme via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Child Theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.majelis.info
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/majelis.info/public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/
