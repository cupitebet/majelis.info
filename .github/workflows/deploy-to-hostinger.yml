name: Deploy Child Theme to Hostinger

# Deploy ONLY meup-child theme + custom files
# WordPress core & plugins are NOT deployed

on:
  push:
    branches:
      - main
    paths:
      - 'wp-content/themes/meup-child/**'
      - 'majelis-*.css'
      - 'majelis-*.php'
  workflow_dispatch:  # Manual trigger

jobs:
  deploy:
    name: Deploy Child Theme via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Child Theme via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          remote_path: /domains/majelis.info/public_html/
          local_path: ./
          sftp_only: true
          port: 65002
          args: '-o ConnectTimeout=5'
